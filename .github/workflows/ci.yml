name: ci

# Least-privilege default (issue #20); the docker job widens packages: write
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --no-audit is not a shortcut: `npm ci` runs an audit of its OWN at the
      # end, against the same retiring endpoint as the step below. On 2026-09-04
      # that turned a 7-second install into a 6-minute one (runs #72/#73) — the
      # packages were in place at 09:28:40, the step ended at 09:34:36.
      - run: npm ci --no-audit --no-fund
      # Audit visibility (issue #13): log-only, does not block the build —
      # triage findings in a follow-up instead of freezing development.
      #
      # Capped at 2 minutes: npm posts this to /-/npm/v1/security/audits/quick,
      # which npm itself now answers with "This endpoint is being retired. Use
      # the bulk advisory endpoint instead" — it stalls ~5 minutes and then
      # returns 400 "Invalid package tree" — plausibly over this repo's
      # `overrides` block, though that part is unverified. So the step is
      # currently red anyway, just hidden by continue-on-error; the cap stops it
      # from setting this pipeline's runtime. GitHub's Dependabot alerts are the
      # standing safety net while it is. Drop the cap once npm's bulk endpoint
      # is what npm reaches for here.
      - run: npm audit --audit-level=high
        continue-on-error: true
        timeout-minutes: 2
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # keep build off the repo data dir
          AQUAMAN_DATA_DIR: /tmp/aquaman-build-data

  docker:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            # :latest tracks main until the first semver release (issue #12)
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# marker: workflow-push-test 2026-08-23 (new PAT)
