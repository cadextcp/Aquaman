services:
  aquaman:
    image: ghcr.io/cadextcp/aquaman:main
    # build: .  # uncomment for local builds
    container_name: aquaman
    restart: unless-stopped
    environment:
      - AQUAMAN_TIMEZONE=Europe/Berlin
      # AI (optional — app works fully without)
      - AQUAMAN_AI_BASE_URL=${AQUAMAN_AI_BASE_URL:-}
      - AQUAMAN_AI_API_KEY=${AQUAMAN_AI_API_KEY:-}
      - AQUAMAN_AI_MODEL=${AQUAMAN_AI_MODEL:-}
      - AQUAMAN_AI_MAX_CALLS_PER_DAY=${AQUAMAN_AI_MAX_CALLS_PER_DAY:-20}
      - AQUAMAN_AI_MAX_TOKENS_PER_DAY=${AQUAMAN_AI_MAX_TOKENS_PER_DAY:-200000}
    volumes:
      - ./data:/app/data
    ports:
      # LOCAL ONLY (R5): reverse proxy (same host/network) fronts this.
      # Do NOT change to plain "3000:3000" — LAN would bypass proxy auth.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
